<!DOCTYPE html>
<html>
  <head>
    <title>jsPsychPluginThreeJSAnimate Example</title>
    <script src="https://unpkg.com/jspsych"></script>
    <script src="https://unpkg.com/@jspsych/plugin-canvas-keyboard-response@2.1.0"></script>
    <!-- Once this plugin package is published, it can be loaded via
<script src="https://unpkg.com/@jspsych-contrib/plugin-three-js-animate"></script>
<script src="../dist/index.browser.js"></script> -->
    <script src="../dist/index.browser.js"></script>
    <script src="../../../../three-utilities/functions/showCharacter/dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych/css/jspsych.css" />
  </head>

  <body></body>
  <script type = "module">

    // Import functions
    import { fetchArrays, makeArray, makeObject } from '../js/utils_light.js';
    import { questionMultiChoice, questionMultiSlider } from '../js/questions.js';

    // Declare variable
		let interactions = [];

    // Look at trajectory
    let file = "scenarios/trajectory.json"
    let response = await fetch(file);
    let json = await response.json();
    //console.log(json);
    let ob = await makeObject(file);
    console.log(ob);

    let ex = await makeArray(file);
    console.log(ex);

    // Load arrays
    const files = ["trajectory2.json", "negligent.json", "blocker.json", "blocker_2.json",
                "blocker_blocker.json"].map((x) => "scenarios/" + x);
    let array_lists = await fetchArrays(files);
    array_lists.unshift(ex);

    const jsPsych = initJsPsych({
      on_data_update: function(data) {
        console.log('Just added new data. The contents of the data are: ' + JSON.stringify(data));
      }
    });

    // Trials
    const sc = showCharacterClass;
    const trial0 = {
				type: jsPsychCanvasKeyboardResponse,
				stimulus: function(c) {
					sc.showCharacter(c,
            "assets/polyman7.glb",
            {
            "Hat": "hsl(120, 30%, 30%)",
            "Shirt": "hsl(0, 100%, 50%)", // Red shirt
            "Pants": "hsl(240, 100%, 50%)",
            "FootL": "hsl(240, 100%, 100%)",
            "FootR": "hsl(240, 100%, 100%)",
            "Eyes": "hsl(240, 100%, 100%)",
            "Irises": "hsl(196, 66%, 70%)",
            "Pupils": "hsl(240, 0%, 0%)",
            "Head": 0xffdcb1,
            "Mouth": 0xffdcb1,
            "HandL": 0xffdcb1,
            "HandR": 0xffdcb1,
            "Hair": "hsl(22, 51%, 16%)"
          },
          "breath_idle",
          [0, 4, 10],
          [0, 2, 0]
          )
				},
				choices: [" ", "Spacebar"],
				canvas_size: [250, 350],
				prompt: `<p>Please press the spacebar to proceed to the first trial.</p>`,
			};

    const trial1 = {
      type: jsPsychPluginThreeJsAnimate,
      array_list: ob.array_list,
      camera_controls: false,
      camera_position: [0, 15, 15],
      canvas_size: [250, 300],
      array_map: [
        {
          number: 1,
          entity_type: "obstacle",
          name: "bush",
          model_path: "assets/bush.glb",
          color_scheme: {
            "Bush": "hsl(120, 30%, 30%)",
          }
        },
        {
          number: 2,
          entity_type: "agent",
          name: "A",
          model_path: "assets/polyman7.glb",
          color_scheme: {
            "Hat": "hsl(120, 30%, 30%)",
            "Shirt": "hsl(0, 100%, 50%)", // Red shirt
            "Pants": "hsl(240, 100%, 50%)",
            "FootL": "hsl(240, 100%, 100%)",
            "FootR": "hsl(240, 100%, 100%)",
            "Eyes": "hsl(240, 100%, 100%)",
            "Irises": "hsl(196, 66%, 70%)",
            "Pupils": "hsl(240, 0%, 0%)",
            "Head": 0xffdcb1,
            "Mouth": 0xffdcb1,
            "HandL": 0xffdcb1,
            "HandR": 0xffdcb1,
            "Hair": "hsl(22, 51%, 16%)"
          },
          idle: "breath_idle",
          actions: ob.A
        },
        {
          number: 3,
          entity_type: "agent",
          name: "B",
          model_path: "assets/polyman7.glb",
          color_scheme: {
            "Hat": "hsl(120, 30%, 60%)",
            "Pants": "hsl(0, 100%, 50%)",
            "Shirt": "hsl(240, 100%, 50%)", // Blue shirt
            "FootL": "hsl(240, 100%, 100%)",
            "FootR": "hsl(240, 100%, 100%)",
            "Eyes": "hsl(240, 100%, 100%)",
            "Irises": "hsl(196, 66%, 70%)",
            "Pupils": "hsl(240, 0%, 0%)",
            "Head": 0xffdcb1,
            "Mouth": 0xffdcb1,
            "HandL": 0xffdcb1,
            "HandR": 0xffdcb1,
            "Hair": "hsl(22, 51%, 16%)"
          },
          idle: "breath_idle",
          actions: ob.B
        }
      ],
      sidewalk_type: "checker",
      trial_type: "observation",
      include_questions: true,
      questions: questionMultiChoice([
        {
          name: "care",
          prompt: "How much does Person A care about other people?",
          options: ["Not at all", "A medium amount", "A lot"],
          requested: true,
          horizontal: true
        }
      ])
    };

    const trial2 = {
      type: jsPsychPluginThreeJsAnimate,
      camera_controls: false,
      camera_position: [0, 15, 15],
      canvas_size: [250, 300],
      array_list: array_lists[1],
      array_map: [
        {
          number: 1,
          entity_type: "obstacle",
          name: "bush",
          model_path: "assets/bush.glb",
          color_scheme: {
            "Bush": "hsl(120, 30%, 30%)",
          }
        },
        {
          number: 2,
          entity_type: "agent",
          name: "A",
          model_path: "assets/polyman7.glb",
          color_scheme: {
            "Hat": "hsl(120, 30%, 30%)",
            "Shirt": "hsl(0, 100%, 50%)",
            "Pants": "hsl(240, 100%, 50%)",
            "FootL": "hsl(240, 100%, 100%)",
            "FootR": "hsl(240, 100%, 100%)",
            "Eyes": "hsl(240, 100%, 100%)",
            "Irises": "hsl(196, 66%, 70%)",
            "Pupils": "hsl(240, 0%, 0%)",
            "Head": 0xffdcb1,
            "Mouth": 0xffdcb1,
            "HandL": 0xffdcb1,
            "HandR": 0xffdcb1,
            "Hair": "hsl(22, 51%, 16%)"
          }
        },
        {
          number: 3,
          entity_type: "agent",
          name: "B",
          model_path: "assets/polyman7.glb",
          color_scheme: {
            "Hat": "hsl(120, 30%, 60%)",
            "Pants": "hsl(0, 100%, 50%)",
            "Shirt": "hsl(240, 100%, 50%)",
            "FootL": "hsl(240, 100%, 100%)",
            "FootR": "hsl(240, 100%, 100%)",
            "Eyes": "hsl(240, 100%, 100%)",
            "Irises": "hsl(196, 66%, 70%)",
            "Pupils": "hsl(240, 0%, 0%)",
            "Head": 0xffdcb1,
            "Mouth": 0xffdcb1,
            "HandL": 0xffdcb1,
            "HandR": 0xffdcb1,
            "Hair": "hsl(22, 51%, 16%)"
          }
        }
      ],
      sidewalk_type: "checker",
      trial_type: "interactive",
      interaction_info: {
        control_character: "A",
        moves: 1
      },
      actions: [[1, 0], [0, 1], [0, 0], [-1, 0], [0, -1]],
      include_questions: true,
      questions: questionMultiSlider([
        {
          name: "care",
          prompt: "How much does Person A care about other people in relation to himself?",
          labels: ["Much less", "The same", "Much more"],
          requested: true,
          min: -5, // Add in defaults
          max: 5,
          step: 0.1,
          start: 0,
          slider_width: 500,
        }
      ])
    };

    jsPsych.run([trial0, trial1, trial2])
  </script>
</html>
