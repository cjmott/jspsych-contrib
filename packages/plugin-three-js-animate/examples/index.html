<!DOCTYPE html>
<html>
  <head>
    <title>jsPsychPluginThreeJSAnimate Example</title>
    <script src="https://unpkg.com/jspsych"></script>
    <!-- Once this plugin package is published, it can be loaded via
<script src="https://unpkg.com/@jspsych-contrib/plugin-three-js-animate"></script>
<script src="../dist/index.browser.js"></script> -->
    <script src="../dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych/css/jspsych.css" />
  </head>

  <body></body>
  <script type = "module">

    // Import functions
    import { fetchArrays } from '../js/utils_light.js';

    // Declare variable
		let interactions = [];

    // Load arrays
    const files = ["negligent.json", "blocker.json", "blocker_2.json",
                "blocker_blocker.json"].map((x) => "scenarios/" + x);
    let array_lists = await fetchArrays(files);

    const jsPsych = initJsPsych();

    const trial1 = {
      type: jsPsychPluginThreeJsAnimate,
      array_list: array_lists[0],
      array_map: [
        {
          number: 1,
          entity_type: "obstacle",
          name: "bush",
          model_path: "assets/bush.glb"
        },
        {
          number: 2,
          entity_type: "agent",
          name: "A",
          model_path: "assets/man_basic.glb"
        },
        {
          number: 3,
          entity_type: "agent",
          name: "B",
          model_path: "assets/man_basic.glb"
        }
      ],
      sidewalk_type: "checker",
      trial_type: "interactive",
      interaction_info: {
        control_character: "B",
        moves: 3
      }
    };

    const trial2 = {
      type: jsPsychPluginThreeJsAnimate,
      array_list: array_lists[1],
      array_map: [
        {
          number: 1,
          entity_type: "obstacle",
          name: "bush",
          model_path: "assets/bush.glb"
        },
        {
          number: 2,
          entity_type: "agent",
          name: "A",
          model_path: "assets/man_basic.glb"
        },
        {
          number: 3,
          entity_type: "agent",
          name: "B",
          model_path: "assets/man_basic.glb"
        }
      ],
      sidewalk_type: "checker",
      trial_type: "interactive"
    };

    jsPsych.run([trial1, trial2])
  </script>
</html>
